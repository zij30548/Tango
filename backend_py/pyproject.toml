[project]
name = "tango-backend"
version = "2.0.0"
description = "探歌 Python 账号、会话与音乐 Agent 后台"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "langgraph>=1.0,<2",
  "langsmith>=0.14.11,<0.15",
  "asyncpg>=0.30,<1",
  "asyncmy>=0.2.10,<1",
  "cryptography>=44,<49",
  "redis>=6,<8",
  "python-dotenv>=1.1,<2",
  "regex>=2024.11",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2"]

[project.scripts]
tango-backend = "tango_backend.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

