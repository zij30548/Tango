name: Tango Harness quick

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-quick-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # SHA 已由 actions 官方发布页核验；不保留写仓库凭据。
      # https://github.com/actions/checkout/releases/tag/v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # https://github.com/actions/setup-python/releases/tag/v7.0.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: 安装锁定的开发依赖
        run: |
          python -m pip install --disable-pip-version-check uv==0.12.7
          uv sync --project backend_py --python 3.12 --frozen
      - name: 运行无密钥离线门禁
        # Ubuntu 24.04 runner 提供 Node；入口验证 >=20，缺失直接失败。
        # 本任务不提供模型密钥，不启动应用/MySQL，不宣称 Qt 或音频已验收。
        run: python scripts/verify-harness.py --tier quick --report .local/harness-ci/report.json
      - name: 显示执行范围与失败阶段
        if: ${{ always() }}
        # 只显示固定元数据，不上传私有日志、原始响应或测试数据库。
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path('.local/harness-ci/report.json')
          if path.is_file():
              report = json.loads(path.read_text())
              print(json.dumps({
                  'tier': report['tier'], 'scope': report['scope'],
                  'status': report['status'], 'reason': report['reason'],
                  'steps': [{key: row[key] for key in ('id', 'exitCode', 'reason', 'seconds')}
                            for row in report['commands']],
              }, ensure_ascii=False, indent=2))
          else:
              print('依赖准备前失败，未取得验收报告。')
          PY
